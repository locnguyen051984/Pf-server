# ========================
# APPLICATION
# ========================
spring.application.name=Pf.product-service
server.port=8082

# ========================
# DATASOURCE (PostgreSQL)
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/pf_product
spring.datasource.username=postgres
spring.datasource.password=2005
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# HIKARICP (CONNECTION POOL)
# ========================
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ========================
# JPA / HIBERNATE
# ========================
# Flyway quan ly schema -> KHONG dung update, chi validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# FLYWAY
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ========================
# LOGGING
# ========================
logging.level.root=INFO
logging.level.com.Pf.product_service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========================
# JWT (contract voi Auth Service)
# ========================
jwt.secret=${JWT_SECRET:a-string-secret-at-least-256-bits-long}
